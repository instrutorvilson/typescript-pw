<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerencia contatos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" 
     integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
     <link  rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
/>

</head>
<body>
    <div class="container col-md-4">
         <h2 class="text-center mt-5">Novo contato</h2>
        <form id="form-contato">
            <label for="nome">Informe nome</label>
            <input type="text" placeholder="EX:maria" id="nome" class="form-control"/>

            <label for="email">Informe email</label>
            <input type="email" placeholder="EX:maria" id="email" class="form-control"/>

            <button class="btn btn-primary mt-3">Gravar</button>
        </form>
        <ul id="lista-contatos"></ul>
    </div>
    <script type="module" src="./dist/controladores/controladorContato.js"></script>
</body>
</html>
